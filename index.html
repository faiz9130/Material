<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ELW 2026 | Employee Learning Week</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            background: #05070d;
            color: #ffffff;
            overflow: hidden;
        }

        /* ==============================
           BACKGROUND
        ============================== */

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(90, 70, 255, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(0, 200, 255, 0.12),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #05070d 0%,
                    #090d18 50%,
                    #04050a 100%
                );
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: #593cff;
            top: -200px;
            left: -150px;
        }

        .orb-2 {
            width: 450px;
            height: 450px;
            background: #00b7ff;
            bottom: -200px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate3d(0, 0, 0);
            }

            to {
                transform: translate3d(60px, 40px, 0);
            }
        }

        /* ==============================
           LOGIN SCREEN
        ============================== */

        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;

            transition:
                opacity 0.8s ease,
                transform 0.8s ease,
                filter 0.8s ease;
        }

        #loginScreen.hide {
            opacity: 0;
            transform: scale(1.06);
            filter: blur(12px);
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 460px;
            text-align: center;
        }

        /* ==============================
           BRAND
        ============================== */

        .brand {
            margin-bottom: 35px;
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 14px;
            margin-bottom: 20px;

            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 100px;

            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.7);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #65ffb2;

            box-shadow:
                0 0 8px #65ffb2,
                0 0 20px rgba(101,255,178,0.5);
        }

        .brand h1 {
            font-size: clamp(42px, 7vw, 68px);
            line-height: 0.95;
            letter-spacing: -4px;
            font-weight: 800;

            background: linear-gradient(
                135deg,
                #ffffff,
                #b6c5ff 60%,
                #7c8cff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand h1 span {
            display: block;
        }

        .brand p {
            margin-top: 18px;
            color: rgba(255,255,255,0.52);
            font-size: 14px;
            line-height: 1.7;
        }

        /* ==============================
           LOGIN CARD
        ============================== */

        .login-card {
            position: relative;

            padding: 32px;

            border-radius: 24px;

            background: rgba(255,255,255,0.055);

            border: 1px solid rgba(255,255,255,0.1);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.06);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
        }

        .login-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;

            background: linear-gradient(
                135deg,
                rgba(255,255,255,0.18),
                transparent,
                rgba(102,124,255,0.2)
            );

            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);

            -webkit-mask-composite: xor;
            pointer-events: none;
        }

        .login-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 26px;
        }

        /* ==============================
           FORM
        ============================== */

        .field {
            text-align: left;
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;

            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;

            color: rgba(255,255,255,0.45);
            text-transform: uppercase;
        }

        .field input {
            width: 100%;
            height: 52px;

            padding: 0 16px;

            color: #ffffff;
            font-size: 14px;

            background: rgba(0,0,0,0.25);

            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;

            outline: none;

            transition: 0.25s;
        }

        .field input::placeholder {
            color: rgba(255,255,255,0.25);
        }

        .field input:focus {
            border-color: rgba(115,135,255,0.8);

            box-shadow:
                0 0 0 3px rgba(100,120,255,0.1),
                0 0 25px rgba(80,100,255,0.08);
        }

        /* ==============================
           BUTTON
        ============================== */

        .enter-btn {
            position: relative;

            width: 100%;
            height: 54px;

            margin-top: 8px;

            border: none;
            border-radius: 13px;

            color: #ffffff;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            background: linear-gradient(
                135deg,
                #625bff,
                #786cff,
                #4f8cff
            );

            box-shadow:
                0 12px 30px rgba(85,90,255,0.28);

            transition:
                transform 0.25s,
                box-shadow 0.25s;
        }

        .enter-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 16px 40px rgba(85,90,255,0.4);
        }

        .enter-btn:active {
            transform: scale(0.98);
        }

        .secure {
            margin-top: 18px;

            font-size: 11px;

            color: rgba(255,255,255,0.28);
        }

        /* ==============================
           VIDEO SCREEN
        ============================== */

        #videoScreen {
            position: fixed;
            inset: 0;

            z-index: 20;

            background: #000;

            opacity: 0;
            visibility: hidden;

            transition: opacity 0.8s ease;
        }

        #videoScreen.show {
            opacity: 1;
            visibility: visible;
        }

        #elwVideo {
            width: 100%;
            height: 100%;

            object-fit: cover;

            background: #000;
        }

        /* ==============================
           SKIP
        ============================== */

        .skip-btn {
            position: absolute;
            right: 25px;
            bottom: 25px;

            z-index: 30;

            padding: 10px 18px;

            border-radius: 100px;
            border: 1px solid rgba(255,255,255,0.25);

            color: rgba(255,255,255,0.8);
            background: rgba(0,0,0,0.35);

            backdrop-filter: blur(10px);

            cursor: pointer;

            font-size: 12px;

            transition: 0.2s;
        }

        .skip-btn:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.15);
        }

        /* ==============================
           LOADING TRANSITION
        ============================== */

        #transitionScreen {
            position: fixed;
            inset: 0;

            z-index: 15;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #05070d;

            opacity: 0;
            visibility: hidden;

            transition: opacity 0.3s;
        }

        #transitionScreen.show {
            opacity: 1;
            visibility: visible;
        }

        .loader {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            border: 2px solid rgba(255,255,255,0.1);
            border-top-color: #ffffff;

            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            #loginScreen {
                padding: 20px;
            }

            .brand {
                margin-bottom: 25px;
            }

            .brand h1 {
                letter-spacing: -2px;
            }

            .login-card {
                padding: 25px 20px;
            }

            #elwVideo {
                object-fit: contain;
            }
        }

    </style>
</head>

<body>

    <!-- Background -->
    <div class="background">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>


    <!-- =====================================
         LOGIN SCREEN
    ====================================== -->

    <section id="loginScreen">

        <div class="login-wrapper">

            <div class="brand">

                <div class="brand-badge">
                    <span class="status-dot"></span>
                    Employee Learning Week 2026
                </div>

                <h1>
                    ELW
                    <span>2026</span>
                </h1>

                <p>
                    Welcome to Employee Learning Week.<br>
                    Discover. Learn. Build what's next.
                </p>

            </div>


            <div class="login-card">

                <h2>Welcome</h2>

                <div class="subtitle">
                    Sign in to enter the ELW 2026 experience
                </div>

                <form id="loginForm">

                    <div class="field">

                        <label>Staff ID / Email</label>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your Staff ID or email"
                            required
                            autocomplete="username"
                        >

                    </div>


                    <div class="field">

                        <label>Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                            autocomplete="current-password"
                        >

                    </div>


                    <button
                        type="submit"
                        class="enter-btn"
                        id="enterButton"
                    >
                        Enter ELW 2026 →
                    </button>

                </form>


                <div class="secure">
                    Secure access • ELW 2026
                </div>

            </div>

        </div>

    </section>


    <!-- =====================================
         TRANSITION
    ====================================== -->

    <div id="transitionScreen">
        <div class="loader"></div>
    </div>


    <!-- =====================================
         VIDEO
    ====================================== -->

    <section id="videoScreen">

        <video
            id="elwVideo"
            playsinline
            preload="auto"
        >
            <source src="elw.mp4" type="video/mp4">

            Your browser does not support HTML5 video.
        </video>

        <button
            class="skip-btn"
            onclick="finishIntro()"
        >
            Skip Intro →
        </button>

    </section>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginScreen =
            document.getElementById("loginScreen");

        const transitionScreen =
            document.getElementById("transitionScreen");

        const videoScreen =
            document.getElementById("videoScreen");

        const video =
            document.getElementById("elwVideo");


        /* =====================================
           LOGIN SUBMIT
        ====================================== */

        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                /*
                 * Put your actual authentication
                 * process here.
                 *
                 * After successful authentication,
                 * call startELW().
                 */

                startELW();

            }
        );


        /* =====================================
           START VIDEO
        ====================================== */

        function startELW() {

            loginScreen.classList.add("hide");

            transitionScreen.classList.add("show");


            setTimeout(() => {

                videoScreen.classList.add("show");

                video.currentTime = 0;

                /*
                 * Because playback happens after
                 * user interaction (submit),
                 * browser normally allows autoplay
                 * WITH sound.
                 */

                const playPromise = video.play();

                if (playPromise !== undefined) {

                    playPromise.catch(error => {

                        console.log(
                            "Video autoplay failed:",
                            error
                        );

                    });

                }

                transitionScreen.classList.remove("show");

            }, 650);

        }


        /* =====================================
           VIDEO FINISHED
        ====================================== */

        video.addEventListener(
            "ended",
            function() {

                finishIntro();

            }
        );


        /* =====================================
           AFTER INTRO
        ====================================== */

        function finishIntro() {

            /*
             * CHANGE THIS to your actual
             * ELW dashboard / homepage.
             */

            window.location.href = "/home";

        }


        /* =====================================
           OPTIONAL:
           ESC KEY TO SKIP VIDEO
        ====================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Escape" &&
                    videoScreen.classList.contains("show")
                ) {

                    finishIntro();

                }

            }
        );

    </script>

</body>
</html>
