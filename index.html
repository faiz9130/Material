<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ELW 2026 | Employee Learning Week</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #04060b;
            overflow: hidden;
        }

        body {
            font-family: Inter, Arial, Helvetica, sans-serif;
            color: #fff;
        }

        /* ==============================
           BACKGROUND
        ============================== */

        .background {
            position: fixed;
            inset: 0;
            z-index: 0;

            background:
                radial-gradient(
                    circle at 18% 18%,
                    rgba(87, 64, 255, .20),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 82% 80%,
                    rgba(0, 184, 255, .13),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #05070d,
                    #090d18 55%,
                    #04050a
                );
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: .32;
            animation: float 10s ease-in-out infinite alternate;
        }

        .orb-one {
            width: 500px;
            height: 500px;
            background: #6047ff;
            top: -230px;
            left: -150px;
        }

        .orb-two {
            width: 450px;
            height: 450px;
            background: #008cff;
            right: -160px;
            bottom: -200px;
            animation-delay: -4s;
        }

        @keyframes float {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(60px, 35px);
            }
        }

        /* ==============================
           LOGIN
        ============================== */

        #loginScreen {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;

            transition:
                opacity .8s ease,
                transform .8s ease,
                filter .8s ease;
        }

        #loginScreen.hide {
            opacity: 0;
            transform: scale(1.05);
            filter: blur(12px);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 470px;
            text-align: center;
        }

        /* ==============================
           ELW BRAND
        ============================== */

        .event-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 15px;
            margin-bottom: 20px;

            border-radius: 100px;

            border: 1px solid rgba(255,255,255,.12);
            background: rgba(255,255,255,.05);

            backdrop-filter: blur(15px);

            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;

            color: rgba(255,255,255,.68);
        }

        .dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;
            background: #62ffaf;

            box-shadow:
                0 0 8px #62ffaf,
                0 0 18px rgba(98,255,175,.5);
        }

        .brand h1 {
            font-size: 66px;
            line-height: .95;

            letter-spacing: -4px;

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #fff,
                    #c1cbff 55%,
                    #7788ff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand h1 span {
            display: block;
        }

        .brand-description {
            margin-top: 17px;
            margin-bottom: 32px;

            font-size: 13px;
            line-height: 1.6;

            color: rgba(255,255,255,.42);
        }

        /* ==============================
           ACCESS CARD
        ============================== */

        .access-card {
            position: relative;

            padding: 31px;

            border-radius: 24px;

            border: 1px solid rgba(255,255,255,.10);

            background: rgba(255,255,255,.055);

            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);

            box-shadow:
                0 30px 80px rgba(0,0,0,.50),
                inset 0 1px 0 rgba(255,255,255,.06);
        }

        /* ==============================
           USER
        ============================== */

        .user-icon {
            width: 54px;
            height: 54px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    rgba(103,92,255,.95),
                    rgba(62,126,255,.95)
                );

            box-shadow:
                0 12px 30px rgba(74,83,255,.28);

            font-size: 19px;
            font-weight: 700;
        }

        .welcome {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;

            color: rgba(255,255,255,.35);

            margin-bottom: 8px;
        }

        .name {
            font-size: 19px;
            line-height: 1.35;

            font-weight: 700;

            color: #fff;
        }

        .position {
            max-width: 350px;

            margin:
                7px auto 0;

            font-size: 12px;
            line-height: 1.55;

            color: rgba(255,255,255,.45);
        }

        .department {
            margin-top: 6px;

            font-size: 11px;
            font-weight: 600;

            color: rgba(151,165,255,.85);
        }

        .divider {
            height: 1px;

            margin: 24px 0;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.10),
                    transparent
                );
        }

        /* ==============================
           PASSWORD
        ============================== */

        .field {
            text-align: left;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            font-size: 10px;
            font-weight: 700;

            letter-spacing: 1.2px;

            color: rgba(255,255,255,.40);

            text-transform: uppercase;
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            width: 100%;
            height: 53px;

            padding: 0 48px 0 16px;

            border-radius: 12px;

            border:
                1px solid rgba(255,255,255,.10);

            background:
                rgba(0,0,0,.24);

            color: white;

            font-size: 15px;

            outline: none;

            transition: .25s;
        }

        .password-wrapper input:focus {
            border-color:
                rgba(112,128,255,.8);

            box-shadow:
                0 0 0 3px rgba(95,110,255,.10);
        }

        .password-wrapper input::placeholder {
            color: rgba(255,255,255,.23);
        }

        .eye {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;
            background: none;

            color: rgba(255,255,255,.40);

            cursor: pointer;

            font-size: 17px;
        }

        /* ==============================
           BUTTON
        ============================== */

        .enter-btn {
            width: 100%;
            height: 54px;

            margin-top: 17px;

            border: none;
            border-radius: 13px;

            color: white;

            font-size: 13px;
            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #615cff,
                    #7167ff,
                    #4289ff
                );

            box-shadow:
                0 13px 32px rgba(80,88,255,.30);

            transition: .25s;
        }

        .enter-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 17px 40px rgba(80,88,255,.40);
        }

        .enter-btn:active {
            transform: scale(.985);
        }

        .secure {
            margin-top: 16px;

            font-size: 10px;

            color: rgba(255,255,255,.25);
        }

        /* ==============================
           VIDEO
        ============================== */

        #videoScreen {
            position: fixed;
            inset: 0;

            z-index: 100;

            background: #000;

            opacity: 0;
            visibility: hidden;

            transition: opacity .65s ease;
        }

        #videoScreen.show {
            opacity: 1;
            visibility: visible;
        }

        #elwVideo {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;

            background: #000;
        }

        /* ==============================
           LOADING
        ============================== */

        #loader {
            position: fixed;
            inset: 0;

            z-index: 50;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #04060b;

            opacity: 0;
            visibility: hidden;

            transition: opacity .3s;
        }

        #loader.show {
            opacity: 1;
            visibility: visible;
        }

        .spinner {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            border:
                2px solid rgba(255,255,255,.10);

            border-top-color: white;

            animation: spin .7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ==============================
           MOBILE
        ============================== */

        @media(max-width: 600px) {

            .brand h1 {
                font-size: 54px;
                letter-spacing: -3px;
            }

            .access-card {
                padding: 25px 20px;
            }

            .name {
                font-size: 17px;
            }

            #elwVideo {
                object-fit: contain;
            }
        }
    </style>
</head>


<body>

    <!-- BACKGROUND -->

    <div class="background">

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

    </div>


    <!-- ==============================
         LOGIN SCREEN
    ============================== -->

    <section id="loginScreen">

        <div class="container">

            <div class="brand">

                <div class="event-label">

                    <span class="dot"></span>

                    EMPLOYEE LEARNING WEEK 2026

                </div>

                <h1>
                    ELW
                    <span>2026</span>
                </h1>

                <div class="brand-description">
                    Discover. Learn. Build what's next.
                </div>

            </div>


            <div class="access-card">

                <div class="user-icon">
                    SA
                </div>

                <div class="welcome">
                    Welcome
                </div>

                <div class="name">
                    Shuhaibahtulaslamiah
                </div>

                <div class="position">
                    Acting Group Chief Human Resource Officer,
                    Group BPMB
                </div>

                <div class="department">
                    Group Human Resource
                </div>


                <div class="divider"></div>


                <form id="loginForm">

                    <div class="field">

                        <label>
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                required
                                autofocus
                            >

                            <button
                                type="button"
                                class="eye"
                                onclick="togglePassword()"
                            >
                                ◉
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        class="enter-btn"
                    >
                        Enter ELW 2026 →
                    </button>

                </form>


                <div class="secure">
                    Secure Access • Employee Learning Week 2026
                </div>

            </div>

        </div>

    </section>


    <!-- ==============================
         LOADING TRANSITION
    ============================== -->

    <div id="loader">
        <div class="spinner"></div>
    </div>


    <!-- ==============================
         VIDEO
    ============================== -->

    <section id="videoScreen">

        <video
            id="elwVideo"
            playsinline
            preload="auto"
        >
            <source
                src="elw.mp4"
                type="video/mp4"
            >
        </video>

    </section>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginScreen =
            document.getElementById("loginScreen");

        const loader =
            document.getElementById("loader");

        const videoScreen =
            document.getElementById("videoScreen");

        const video =
            document.getElementById("elwVideo");


        /* ==============================
           PASSWORD SHOW / HIDE
        ============================== */

        function togglePassword() {

            const password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }


        /* ==============================
           LOGIN
        ============================== */

        loginForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                /*
                 * =====================================
                 * PUT YOUR REAL PASSWORD
                 * VALIDATION HERE
                 * =====================================
                 *
                 * Once authentication is successful:
                 *
                 * startExperience();
                 *
                 */


                await startExperience();

            }
        );


        /* ==============================
           FULLSCREEN + VIDEO
        ============================== */

        async function startExperience() {

            /*
             * Request fullscreen immediately
             * from user's button interaction.
             *
             * Browser address bar / toolbar
             * will disappear if browser allows it.
             */

            try {

                const element =
                    document.documentElement;

                if (element.requestFullscreen) {

                    await element.requestFullscreen();

                } else if (
                    element.webkitRequestFullscreen
                ) {

                    await element.webkitRequestFullscreen();

                }

            } catch (error) {

                console.log(
                    "Fullscreen unavailable:",
                    error
                );

            }


            loginScreen.classList.add("hide");

            loader.classList.add("show");


            /*
             * Short transition before video
             */

            setTimeout(async () => {

                videoScreen.classList.add("show");

                video.currentTime = 0;


                try {

                    await video.play();

                } catch (error) {

                    console.log(
                        "Video playback failed:",
                        error
                    );

                }


                loader.classList.remove("show");

            }, 500);

        }


        /* ==============================
           VIDEO FINISHED
        ============================== */

        video.addEventListener(
            "ended",
            function() {

                /*
                 * Redirect to ELW main page.
                 *
                 * Change this URL according
                 * to your Laravel route.
                 */

                window.location.href = "/home";

            }
        );

    </script>

</body>
</html>
